<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1f5c3f" />
<meta name="description" content="Record your tennis matches, opponents and practice sessions, and track your stats." />
<title>MyTennisApp</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MyTennisApp" />
<style>
  :root{
    --green:#1f5c3f; --green-dark:#103227; --lime:#c9e86b; --lime-dark:#9fce3a;
    --bg:#f4f6f4; --card:#ffffff; --ink:#1b2420; --muted:#6b7a72; --line:#e2e8e3;
    --win:#1f8a52; --loss:#c0453b; --shadow:0 2px 10px rgba(16,50,39,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--ink);padding-bottom:76px;line-height:1.45}
  header{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;
    padding:16px 16px calc(14px + env(safe-area-inset-top)) 16px;padding-top:calc(16px + env(safe-area-inset-top));
    position:sticky;top:0;z-index:20;box-shadow:var(--shadow)}
  header .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  header h1{font-size:19px;margin:0;display:flex;align-items:center;gap:9px;font-weight:700}
  .ball{width:22px;height:22px;border-radius:50%;background:var(--lime);position:relative;flex:0 0 auto}
  .ball::before,.ball::after{content:"";position:absolute;inset:0;border:2px solid var(--green-dark);
    border-radius:50%;clip-path:inset(0 50% 0 0)}
  .ball::after{clip-path:inset(0 0 0 50%)}
  .hbtns{display:flex;gap:8px}
  .hbtn{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:9px;padding:7px 10px;
    font-size:12.5px;font-weight:600;cursor:pointer}
  .hbtn:active{background:rgba(255,255,255,.28)}
  main{max-width:760px;margin:0 auto;padding:14px}
  .view{display:none}.view.active{display:block}
  h2.sec{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 2px 10px}
  /* dashboard */
  .dfilter{display:flex;gap:5px;background:var(--card);padding:5px;border-radius:12px;box-shadow:var(--shadow);margin-bottom:14px}
  .dfilter button{flex:1;border:0;background:none;padding:10px 6px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer}
  .dfilter button.on{background:var(--green);color:#fff}
  .drange{display:flex;align-items:flex-end;gap:8px;margin-bottom:14px}
  .drange label{flex:1;margin:0;font-size:11.5px;color:var(--muted);font-weight:600}
  .drange input{margin-top:3px;padding:9px}
  .drange .clr{flex:0 0 auto;width:auto;border:0;background:#eef2ee;color:var(--ink);font-weight:700;
    padding:10px 13px;border-radius:9px;cursor:pointer;font-size:13px}
  .dpresets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .dpresets button{flex:1;min-width:calc(50% - 3px);border:1px solid var(--line);background:#fbfdfb;
    color:var(--muted);font-weight:700;font-size:12.5px;padding:9px 6px;border-radius:9px;cursor:pointer}
  .dpresets button.on{background:var(--green);color:#fff;border-color:transparent}
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:16px}
  .stat{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
  .stat .n{font-size:26px;font-weight:800;color:var(--green)}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px}
  .stat.win .n{color:var(--win)}
  .stat .delta{font-size:11.5px;font-weight:700;margin-top:5px;display:flex;align-items:center;gap:3px;flex-wrap:wrap}
  .stat .delta.up{color:var(--win)}
  .stat .delta.down{color:var(--loss)}
  .stat .delta.flat{color:var(--muted)}
  .stat .delta .dl2{color:var(--muted);font-weight:600;font-size:10.5px}
  .bar-wrap{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:16px}
  .bar-wrap h3{margin:0 0 12px;font-size:13.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .bar-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .bar-row .lbl{width:92px;flex:0 0 auto;color:var(--ink)}
  .bar-track{flex:1;background:#eef2ee;border-radius:6px;height:16px;overflow:hidden}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--lime-dark),var(--green));border-radius:6px}
  .bar-row .val{width:52px;text-align:right;color:var(--muted);flex:0 0 auto}
  /* cards / lists */
  .item{background:var(--card);border-radius:13px;padding:13px 14px;box-shadow:var(--shadow);margin-bottom:10px;
    display:flex;align-items:flex-start;gap:12px;cursor:pointer}
  .item:active{transform:scale(.995)}
  .item .main{flex:1;min-width:0}
  .item .t{font-weight:700;font-size:15px}
  .item .s{font-size:12.5px;color:var(--muted);margin-top:3px}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .pill.win{background:#e3f4ea;color:var(--win)}
  .pill.loss{background:#fbe6e4;color:var(--loss)}
  .pill.neutral{background:#eef2ee;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px}
  .empty .big{font-size:40px;margin-bottom:8px}
  /* fab */
  .fab{position:fixed;right:18px;bottom:88px;width:56px;height:56px;border-radius:50%;
    background:var(--green);color:#fff;border:0;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(16,50,39,.35);
    cursor:pointer;z-index:30;display:flex;align-items:center;justify-content:center}
  .fab:active{background:var(--green-dark)}
  /* bottom nav */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
    display:flex;z-index:25;padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs button{flex:1;background:none;border:0;padding:9px 4px 7px;color:var(--muted);font-size:11px;
    display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-weight:600}
  nav.tabs button .ic{font-size:20px}
  nav.tabs button.on{color:var(--green)}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(16,50,39,.45);display:none;z-index:40;align-items:flex-end;justify-content:center}
  .modal-bg.show{display:flex}
  .modal{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;
    padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  @media(min-width:600px){.modal-bg{align-items:center}.modal{border-radius:18px;max-height:88vh}}
  .modal h3{margin:2px 0 14px;font-size:18px}
  label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin:11px 0 4px}
  input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;
    font-size:15px;font-family:inherit;background:#fbfdfb;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--lime-dark);border-color:transparent}
  textarea{min-height:64px;resize:vertical}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:4px}
  .seg input{display:none}
  .seg label{flex:1;margin:0;text-align:center;padding:11px;font-size:14.5px;color:var(--muted);
    font-weight:700;cursor:pointer;background:#fbfdfb}
  .seg input:checked + label{background:var(--green);color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .chips input{display:none}
  .chips label{margin:0;padding:9px 14px;border:1px solid var(--line);border-radius:999px;
    font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;background:#fbfdfb}
  .chips input:checked + label{background:var(--green);color:#fff;border-color:transparent}
  .modal-actions{display:flex;gap:10px;margin-top:18px}
  .btn{flex:1;padding:13px;border-radius:11px;border:0;font-size:15px;font-weight:700;cursor:pointer}
  .btn.primary{background:var(--green);color:#fff}
  .btn.primary:active{background:var(--green-dark)}
  .btn.ghost{background:#eef2ee;color:var(--ink)}
  .btn.danger{background:#fbe6e4;color:var(--loss);flex:0 0 auto;padding:13px 16px}
  .menu-sheet button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
    padding:14px 6px;font-size:15px;cursor:pointer;color:var(--ink)}
  .menu-sheet button:last-child{border-bottom:0}
  .hint{font-size:11.5px;color:var(--muted);margin-top:5px}
  .fileimport{display:none}
  /* ---------------- intro / splash ---------------- */
  #splash{position:fixed;inset:0;z-index:9999;
    background:linear-gradient(160deg,#2a6a49 0%,var(--green) 30%,var(--green-dark) 72%,#0b241b 100%);
    color:#fff;display:flex;align-items:center;justify-content:center;
    padding:calc(22px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom));
    opacity:1;transition:opacity .5s ease}
  #splash.hide{opacity:0;pointer-events:none}
  .sp-inner{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .sp-brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800;letter-spacing:.02em;
    color:#eafbef;opacity:.95;margin-bottom:16px}
  .sp-ball{width:20px;height:20px;border-radius:50%;background:var(--lime);position:relative;flex:0 0 auto}
  .sp-ball::before,.sp-ball::after{content:"";position:absolute;inset:0;border:2px solid var(--green-dark);
    border-radius:50%;clip-path:inset(0 50% 0 0)}
  .sp-ball::after{clip-path:inset(0 0 0 50%)}
  .sp-photos{position:relative;width:100%;aspect-ratio:3/2;border-radius:18px;overflow:hidden;
    background:#0b241b;box-shadow:0 14px 40px rgba(0,0,0,.45);border:2px solid rgba(201,232,107,.35)}
  .sp-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease}
  .sp-photo.on{opacity:1}
  .sp-photos.sp-hide{display:none}
  .sp-sub:empty{display:none}
  .sp-dots{position:absolute;left:0;right:0;bottom:10px;display:flex;gap:7px;justify-content:center;z-index:2}
  .sp-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45);transition:all .3s}
  .sp-dot.on{background:var(--lime);width:20px;border-radius:4px}
  .sp-tagline{margin-top:18px;font-size:12px;text-transform:uppercase;letter-spacing:.14em;
    color:var(--lime);font-weight:700}
  .sp-name{font-size:26px;font-weight:800;margin-top:5px;line-height:1.15}
  .sp-sub{font-size:13.5px;color:#cfe6d7;margin-top:6px}
  .sp-contact{margin-top:18px;width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
    border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
  .sp-row{display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:700;
    color:#fff;text-decoration:none}
  .sp-row .sp-ic{font-size:17px}
  .sp-row.tel{color:var(--lime)}
  .sp-skip{margin-top:20px;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:24px;
    padding:11px 26px;font-size:14px;font-weight:700;cursor:pointer}
  .sp-skip:active{background:rgba(255,255,255,.26)}
  .sp-progress{margin-top:16px;width:120px;height:4px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
  .sp-progbar{height:100%;width:0;background:var(--lime);border-radius:3px}
  .sp-progbar.run{width:100%;transition:width 10s linear}
  body.splash-lock{overflow:hidden}
  @media (max-height:640px){
    .sp-name{font-size:22px}.sp-brand{margin-bottom:10px}.sp-tagline{margin-top:12px}
    .sp-contact{margin-top:12px}.sp-skip{margin-top:12px}
  }
</style>
</head>
<body>
<!-- =============== INTRO / ABOUT (10s on launch; content by device timezone) =============== -->
<div id="splash" role="dialog" aria-label="MyTennisApp intro">
  <div class="sp-inner">
    <div class="sp-brand"><span class="sp-ball"></span> MyTennisApp</div>
    <div class="sp-photos" id="spPhotos"></div>
    <div class="sp-tagline" id="spTagline"></div>
    <div class="sp-name" id="spName"></div>
    <div class="sp-sub" id="spSub"></div>
    <div class="sp-contact" id="spContact"></div>
    <button class="sp-skip" id="spSkip" type="button">Enter app ›</button>
    <div class="sp-progress"><div class="sp-progbar" id="spProg"></div></div>
  </div>
</div>

<header>
  <div class="row">
    <h1><span class="ball"></span> MyTennisApp</h1>
    <div class="hbtns">
      <button class="hbtn" onclick="openMenu()">Data ▾</button>
    </div>
  </div>
</header>

<main>
  <!-- DASHBOARD -->
  <section id="v-dash" class="view active">
    <div class="dfilter" id="dashFilter">
      <button data-f="all" class="on" onclick="setDashFilter('all')">All</button>
      <button data-f="Singles" onclick="setDashFilter('Singles')">Singles</button>
      <button data-f="Doubles" onclick="setDashFilter('Doubles')">Doubles</button>
    </div>
    <div class="dpresets" id="dashPresets">
      <button data-p="30" onclick="applyPreset('30')">Last 30 days</button>
      <button data-p="60" onclick="applyPreset('60')">Last 60 days</button>
      <button data-p="90" onclick="applyPreset('90')">Last 90 days</button>
      <button data-p="year" onclick="applyPreset('year')">This Year</button>
    </div>
    <div class="drange">
      <label>From<input type="date" id="dashFrom" onchange="setDashRange()"></label>
      <label>To<input type="date" id="dashTo" onchange="setDashRange()"></label>
      <button class="clr" onclick="clearDashRange()">Clear</button>
    </div>
    <div class="stat-grid" id="statGrid"></div>
    <div class="bar-wrap"><h3>Results by surface</h3><div id="surfaceBars"></div></div>
    <div class="bar-wrap"><h3>Top opponents (head-to-head)</h3><div id="oppBars"></div></div>
    <div class="bar-wrap"><h3>Practice focus (% of time)</h3><div id="focusBars"></div></div>
  </section>

  <!-- MATCHES -->
  <section id="v-matches" class="view">
    <h2 class="sec">Matches</h2>
    <div id="matchList"></div>
  </section>

  <!-- OPPONENTS -->
  <section id="v-opponents" class="view">
    <h2 class="sec">Opponents</h2>
    <div id="oppList"></div>
  </section>

  <!-- PRACTICES -->
  <section id="v-practices" class="view">
    <h2 class="sec">Practices</h2>
    <div id="pracList"></div>
  </section>
</main>

<button class="fab" id="fab" onclick="addCurrent()">+</button>

<nav class="tabs">
  <button data-v="dash" class="on" onclick="show('dash')"><span class="ic">📊</span>Dashboard</button>
  <button data-v="matches" onclick="show('matches')"><span class="ic">🎾</span>Matches</button>
  <button data-v="opponents" onclick="show('opponents')"><span class="ic">👤</span>Opponents</button>
  <button data-v="practices" onclick="show('practices')"><span class="ic">🏋️</span>Practices</button>
  <button onclick="openAbout()"><span class="ic">ℹ️</span>About</button>
</nav>

<!-- MODAL -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<input type="file" id="fileImport" class="fileimport" accept="application/json" onchange="doImport(event)" />

<script>
/* ---------------- storage ---------------- */
const K = {m:'tennis_matches', o:'tennis_opponents', p:'tennis_practices'};
const load = k => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch(e){ return []; } };
const save = (k,v) => localStorage.setItem(k, JSON.stringify(v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

let matches = load(K.m), opponents = load(K.o), practices = load(K.p);

/* seed example data on very first run */
if(!localStorage.getItem('tennis_seeded')){
  opponents = [{id:uid(),name:'Rajiv Sharma',club:'DLTA',hand:'Right',level:'Intermediate',city:'New Delhi',contact:'',notes:'Strong forehand, slower to the net'}];
  matches = [{id:uid(),date:'2026-08-08',opponent:'Rajiv Sharma',type:'Competitive',surface:'Hard',location:'DLTA, New Delhi',score:'6-4 3-6 6-2',result:'Win',setsW:2,setsL:1,duration:95,notes:'Served well; backhand under pressure needs work'}];
  practices = [{id:uid(),date:'2026-08-07',focus:'Serve + Forehand',duration:75,with:'Coach Anil',location:'DLTA, New Delhi',intensity:4,notes:'200 serves; worked on toss consistency'}];
  save(K.m,matches);save(K.o,opponents);save(K.p,practices);
  localStorage.setItem('tennis_seeded','1');
}

/* ---------------- view switching ---------------- */
let current = 'dash';
let dashFilter = 'all';   // 'all' | 'Singles' | 'Doubles' — dashboard stats filter
let dashFrom = '';        // dashboard date-range start (YYYY-MM-DD); '' = open
let dashTo   = '';        // dashboard date-range end   (YYYY-MM-DD); '' = open
let dashPreset = '';      // '' | '30' | '60' | '90' | 'year' — active quick preset
function setDashFilter(f){
  dashFilter = f;
  document.querySelectorAll('#dashFilter button').forEach(b=>b.classList.toggle('on', b.dataset.f===f));
  renderDash();
}
function isoDay(dt){ const z=new Date(dt.getTime()-dt.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function presetRange(preset){
  const today=new Date(), to=isoDay(today);
  let from;
  if(preset==='year'){ from=isoDay(new Date(today.getFullYear(),0,1)); }
  else { const d=new Date(today); d.setDate(d.getDate()-(+preset-1)); from=isoDay(d); }
  return {from,to};
}
function markActivePreset(){
  document.querySelectorAll('#dashPresets button').forEach(b=>b.classList.toggle('on', b.dataset.p===dashPreset));
}
function saveDashRange(){ save('tennis_dashrange', {preset:dashPreset, from:dashFrom, to:dashTo}); }
function reflectRangeInputs(){
  document.getElementById('dashFrom').value = dashFrom;
  document.getElementById('dashTo').value   = dashTo;
  markActivePreset();
}
function applyPreset(preset, doRender=true){
  dashPreset = preset;
  const r = presetRange(preset);
  dashFrom = r.from; dashTo = r.to;
  reflectRangeInputs();
  saveDashRange();
  if(doRender) renderDash();
}
function setDashRange(){
  dashFrom = document.getElementById('dashFrom').value;
  dashTo   = document.getElementById('dashTo').value;
  dashPreset = '';
  markActivePreset();
  saveDashRange();
  renderDash();
}
function clearDashRange(){
  dashFrom=''; dashTo=''; dashPreset='';
  reflectRangeInputs();
  saveDashRange();
  renderDash();
}
function restoreDashRange(){
  let r=null; try{ r=JSON.parse(localStorage.getItem('tennis_dashrange')); }catch(e){}
  if(!r) return;
  if(r.preset){ applyPreset(r.preset, false); }
  else { dashFrom=r.from||''; dashTo=r.to||''; reflectRangeInputs(); }
}
function inDashRange(d){
  if(dashFrom && (!d || d<dashFrom)) return false;
  if(dashTo   && (!d || d>dashTo))   return false;
  return true;
}
function show(v){
  current = v;
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('active'));
  document.getElementById('v-'+v).classList.add('active');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  document.getElementById('fab').style.display = (v==='dash') ? 'none' : 'flex';
  render();
  window.scrollTo(0,0);
}
function addCurrent(){
  if(current==='matches') editMatch();
  else if(current==='opponents') editOpponent();
  else if(current==='practices') editPractice();
}

/* ---------------- helpers ---------------- */
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byDateDesc = (a,b)=> ((b.date||'')+'T'+(b.time||'')).localeCompare((a.date||'')+'T'+(a.time||''));
function fmtDate(d){ if(!d) return ''; const dt=new Date(d+'T00:00:00'); return isNaN(dt)?d:dt.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }
/* parse a score string like "6-4 3-6 7-6(5)" -> sets & games won/lost (your games first) */
function parseScore(score){
  if(!score) return null;
  let sW=0,sL=0,gW=0,gL=0,found=false;
  score.trim().split(/\s+/).forEach(tok=>{
    const cleaned = tok.replace(/\([^)]*\)/g,''); // drop tiebreak marker e.g. (5)
    const mm = cleaned.match(/^(\d+)-(\d+)$/);
    if(mm){ found=true; const a=+mm[1], b=+mm[2]; gW+=a; gL+=b; if(a>b)sW++; else if(b>a)sL++; }
  });
  return found ? {setsW:sW,setsL:sL,gamesW:gW,gamesL:gL} : null;
}
function metricsFor(mset,pset){
  const total=mset.length;
  const wins=mset.filter(m=>m.result==='Win').length;
  const losses=mset.filter(m=>m.result==='Loss').length;
  let setsW=0,setsL=0,gamesW=0,gamesL=0;
  mset.forEach(m=>{ const p=parseScore(m.score);
    if(p){ setsW+=p.setsW; setsL+=p.setsL; gamesW+=p.gamesW; gamesL+=p.gamesL; }
    else { setsW+=(+m.setsW||0); setsL+=(+m.setsL||0); } });
  const winPct=(wins+losses)?wins/(wins+losses)*100:0;
  const setPct=(setsW+setsL)?setsW/(setsW+setsL)*100:0;
  const gamePct=(gamesW+gamesL)?gamesW/(gamesW+gamesL)*100:0;
  const mins=pset.reduce((s,p)=>s+(+p.duration||0),0);
  return {total,wins,losses,setsW,setsL,gamesW,gamesL,winPct,setPct,gamePct,sessions:pset.length,mins};
}
function pctDelta(cur,prev){
  if(prev==null) return null;
  if(prev===0){ if(!cur) return null; return {txt:'new',up:true}; }
  const r=Math.round((cur-prev)/Math.abs(prev)*100);
  return {txt:Math.abs(r)+'%', up: r>0?true:(r<0?false:null)};
}

function renderDash(){
  // apply the All / Singles / Doubles filter (matches with no format count as Singles)
  const ms = matches.filter(m => (dashFilter==='all' ? true : (m.format||'Singles')===dashFilter) && inDashRange(m.date));
  const ps = practices.filter(p => inDashRange(p.date));
  const cur = metricsFor(ms, ps);
  const total=cur.total, wins=cur.wins, losses=cur.losses, rate=Math.round(cur.winPct);
  const setsW=cur.setsW, setsL=cur.setsL, gamesW=cur.gamesW, gamesL=cur.gamesL, mins=cur.mins;
  const oppFaced = new Set(ms.map(m=>m.opponent).filter(Boolean)).size;

  // previous period: same-length window immediately before the selected range (only when a bounded range is active)
  let prev=null;
  if(dashFrom && dashTo){
    const MS=86400000, f=new Date(dashFrom+'T00:00:00');
    const days=Math.round((new Date(dashTo+'T00:00:00')-f)/MS)+1;
    const pTo=isoDay(new Date(f.getTime()-MS));
    const pFrom=isoDay(new Date(f.getTime()-days*MS));
    const inPrev=d=> d && d>=pFrom && d<=pTo;
    const pm=matches.filter(m=>(dashFilter==='all'?true:(m.format||'Singles')===dashFilter) && inPrev(m.date));
    const pp=practices.filter(p=>inPrev(p.date));
    prev=metricsFor(pm,pp);
  }
  const dl=(c,p)=> prev ? pctDelta(c,p) : null;
  const stats = [
    {n:total,l:'Matches played', d:dl(cur.total, prev&&prev.total)},
    {n:rate+'%',l:'Win rate',cls:'win', d:dl(cur.winPct, prev&&prev.winPct)},
    {n:wins+'–'+losses,l:'Win – Loss', d:dl(cur.winPct, prev&&prev.winPct)},
    {n:setsW+'–'+setsL,l:'Sets won – lost', d:dl(cur.setPct, prev&&prev.setPct)},
    {n:gamesW+'–'+gamesL,l:'Games won – lost', d:dl(cur.gamePct, prev&&prev.gamePct)},
    {n:oppFaced,l:'Opponents faced'},
    {n:ps.length,l:'Practice sessions', d:dl(cur.sessions, prev&&prev.sessions)},
    {n:(mins>=60?(mins/60).toFixed(1)+'h':mins+'m'),l:'Time practiced', d:dl(cur.mins, prev&&prev.mins)}
  ];
  document.getElementById('statGrid').innerHTML = stats.map(s=>{
    const dd = s.d ? `<div class="delta ${s.d.up===true?'up':(s.d.up===false?'down':'flat')}">${s.d.up===true?'▲':(s.d.up===false?'▼':'')} ${esc(s.d.txt)} <span class="dl2">vs prev</span></div>` : '';
    return `<div class="stat ${s.cls||''}"><div class="n">${esc(s.n)}</div><div class="l">${esc(s.l)}</div>${dd}</div>`;
  }).join('');

  // surface breakdown
  const surf = {};
  ms.forEach(m=>{ const k=m.surface||'—'; surf[k]=surf[k]||{w:0,t:0}; surf[k].t++; if(m.result==='Win')surf[k].w++; });
  const sKeys = Object.keys(surf).sort((a,b)=>surf[b].t-surf[a].t);
  document.getElementById('surfaceBars').innerHTML = sKeys.length ? sKeys.map(k=>{
    const {w,t}=surf[k]; const pct=t?Math.round(w/t*100):0;
    return `<div class="bar-row"><span class="lbl">${esc(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="val">${w}/${t}</span></div>`;
  }).join('') : '<div class="hint">No matches yet.</div>';

  // top opponents
  const opp = {};
  ms.forEach(m=>{ const k=m.opponent||'—'; opp[k]=opp[k]||{w:0,t:0}; opp[k].t++; if(m.result==='Win')opp[k].w++; });
  const oKeys = Object.keys(opp).sort((a,b)=>opp[b].t-opp[a].t).slice(0,6);
  document.getElementById('oppBars').innerHTML = oKeys.length ? oKeys.map(k=>{
    const {w,t}=opp[k]; const pct=t?Math.round(w/t*100):0;
    return `<div class="bar-row"><span class="lbl">${esc(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="val">${w}–${t-w}</span></div>`;
  }).join('') : '<div class="hint">No matches yet.</div>';

  // practice focus: split each session's minutes evenly across its selected strokes
  const strokeMin = {};
  ps.forEach(p=>{
    const dur = +p.duration||0; if(!dur) return;
    const sel = STROKES.filter(st=>focusHas(p.focus,st)); if(!sel.length) return;
    const share = dur/sel.length;
    sel.forEach(st=>{ strokeMin[st]=(strokeMin[st]||0)+share; });
  });
  const focusTot = Object.values(strokeMin).reduce((a,b)=>a+b,0);
  const fKeys = Object.keys(strokeMin).sort((a,b)=>strokeMin[b]-strokeMin[a]);
  document.getElementById('focusBars').innerHTML = focusTot ? fKeys.map(k=>{
    const pct = Math.round(strokeMin[k]/focusTot*100);
    const mm = strokeMin[k];
    const tlabel = mm>=60 ? (mm/60).toFixed(1)+'h' : Math.round(mm)+'m';
    return `<div class="bar-row"><span class="lbl">${esc(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="val" style="width:auto;min-width:82px">${pct}% \u00b7 ${tlabel}</span></div>`;
  }).join('') : '<div class="hint">No practice focus logged yet.</div>';
}

function download(name, text, type){
  const blob = new Blob([text], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}
function exportJSON(){
  download('MyTennisApp_backup_'+new Date().toISOString().slice(0,10)+'.json',
    JSON.stringify({matches,opponents,practices,exported:new Date().toISOString()},null,2),
    'application/json'); closeModal();
}
function csvCell(v){ v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function exportCSV(kind){
  let rows=[], head=[];
  if(kind==='matches'){ head=['Date','Time','Format','Partner','Opponent','Match Type','Surface','Location','Score','Result','Sets Won','Sets Lost','Duration (min)','Notes'];
    rows=[...matches].sort(byDateDesc).map(m=>[m.date,m.time,m.format||'Singles',m.partner,m.opponent,m.type,m.surface,m.location,m.score,m.result,m.setsW,m.setsL,m.duration,m.notes]); }
  if(kind==='opponents'){ head=['Opponent','Club / Team','Handedness','Level / Rating','City','Contact','Notes'];
    rows=opponents.map(o=>[o.name,o.club,o.hand,o.level,o.city,o.contact,o.notes]); }
  if(kind==='practices'){ head=['Practice','Date','Time','Focus','Duration (min)','With','Location','Intensity (1-5)','Notes'];
    rows=[...practices].sort(byDateDesc).map((p,i)=>['P'+String(i+1).padStart(3,'0'),p.date,p.time,p.focus,p.duration,p.with,p.location,p.intensity,p.notes]); }
  const csv=[head, ...rows].map(r=>r.map(csvCell).join(',')).join('\n');
  download('MyTennisApp_'+kind+'.csv', csv, 'text/csv'); closeModal();
}
function doImport(ev){
  const file = ev.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!confirm('Restore backup? This replaces your current data.')) return;
      matches = d.matches||[]; opponents = d.opponents||[]; practices = d.practices||[];
      save(K.m,matches); save(K.o,opponents); save(K.p,practices);
      closeModal(); render(); alert('Backup restored.');
    }catch(e){ alert('That file could not be read as a MyTennisApp backup.'); }
    ev.target.value='';
  };
  r.readAsText(file);
}

/* Map IANA timezones -> variant key. Everything not listed uses DEFAULT. */
var TZ_TO_VARIANT = {
  'America/Lima':'PE',
  // United States (all IANA zones)
  'America/New_York':'US','America/Detroit':'US','America/Kentucky/Louisville':'US',
  'America/Kentucky/Monticello':'US','America/Indiana/Indianapolis':'US','America/Indiana/Vincennes':'US',
  'America/Indiana/Winamac':'US','America/Indiana/Marengo':'US','America/Indiana/Petersburg':'US',
  'America/Indiana/Vevay':'US','America/Chicago':'US','America/Indiana/Tell_City':'US',
  'America/Indiana/Knox':'US','America/Menominee':'US','America/North_Dakota/Center':'US',
  'America/North_Dakota/New_Salem':'US','America/North_Dakota/Beulah':'US','America/Denver':'US',
  'America/Boise':'US','America/Phoenix':'US','America/Los_Angeles':'US','America/Anchorage':'US',
  'America/Juneau':'US','America/Sitka':'US','America/Metlakatla':'US','America/Yakutat':'US',
  'America/Nome':'US','America/Adak':'US','Pacific/Honolulu':'US'
};

/* Pick the variant from ?about= override, then timezone, then language, then DEFAULT. */
function pickAboutVariant(){
  try{
    var q = new URLSearchParams(location.search).get('about');
    if(q && ABOUT[q.toUpperCase()]) return q.toUpperCase();
  }catch(e){}
  var tz = '';
  try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch(e){}
  if(TZ_TO_VARIANT[tz]) return TZ_TO_VARIANT[tz];
  var lang = (navigator.language || '').toLowerCase();
  if(lang === 'es-pe') return 'PE';
  if(lang.indexOf('en-us') === 0) return 'US';
  return 'DEFAULT';
}

(function(){
  var splash = document.getElementById('splash');
  if(!splash) return;
  var frame = document.getElementById('spPhotos');
  var prog  = document.getElementById('spProg');
  var photoEls = [], dots = [], i = 0, rotateId = null, dismissId = null;

  function prettyUrl(u){ return String(u||'').replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/$/,''); }

  function makeRow(icon, text, href){
    var el = href ? document.createElement('a') : document.createElement('div');
    el.className = 'sp-row' + (href ? ' tel' : '');
    if(href){ el.href = href; el.target = '_blank'; el.rel = 'noopener'; }
    var ic = document.createElement('span'); ic.className = 'sp-ic'; ic.textContent = icon;
    var tx = document.createElement('span'); tx.textContent = text;
    el.appendChild(ic); el.appendChild(tx);
    return el;
  }

  function buildContact(v){
    var wrap = document.getElementById('spContact');
    wrap.innerHTML = '';
    var t = v.contactType, val = v.contactValue || '', row = null;
    if(t === 'whatsapp'){
      var digits = val.replace(/[^0-9]/g,'');
      var href = 'https://wa.me/' + digits + (v.waMessage ? ('?text=' + encodeURIComponent(v.waMessage)) : '');
      row = makeRow('💬', val, href);
    } else if(t === 'facebook'){
      row = makeRow('📘', prettyUrl(val), val);
    } else if(t === 'website'){
      row = makeRow('🌐', prettyUrl(val), val);
    } else if(val){
      row = makeRow('📞', val, 'tel:' + val.replace(/[^0-9+]/g,''));
    }
    if(row) wrap.appendChild(row);
    if(v.location) wrap.appendChild(makeRow('📍', v.location, null));
    wrap.style.display = wrap.children.length ? 'flex' : 'none';
  }

  /* keep only photos whose files actually load (preserves order); callback gets the list */
  function resolvePhotos(list, cb){
    list = list || [];
    var ok = {}, pending = list.length;
    if(!pending){ cb([]); return; }
    list.forEach(function(src){
      var im = new Image();
      im.onload  = function(){ ok[src] = true; done(); };
      im.onerror = function(){ done(); };
      im.src = src;
    });
    function done(){ if(--pending === 0) cb(list.filter(function(s){ return ok[s]; })); }
  }

  function buildPhotos(list){
    frame.innerHTML = '';
    photoEls = []; dots = [];
    if(!list.length){ frame.classList.add('sp-hide'); return; }
    frame.classList.remove('sp-hide');
    list.forEach(function(src, idx){
      var im = document.createElement('img');
      im.className = 'sp-photo' + (idx===0 ? ' on' : '');
      im.src = src; im.alt = '';
      frame.appendChild(im); photoEls.push(im);
    });
    var dotsWrap = document.createElement('div'); dotsWrap.className = 'sp-dots';
    list.forEach(function(_, idx){
      var d = document.createElement('span'); d.className = 'sp-dot' + (idx===0 ? ' on' : '');
      dotsWrap.appendChild(d); dots.push(d);
    });
    frame.appendChild(dotsWrap);
  }

  function setActive(n){
    photoEls.forEach(function(p,idx){ p.classList.toggle('on', idx===n); });
    dots.forEach(function(d,idx){ d.classList.toggle('on', idx===n); });
  }

  function renderVariant(v){
    document.getElementById('spTagline').textContent = v.tagline || '';
    document.getElementById('spName').textContent    = v.name || '';
    document.getElementById('spSub').textContent     = v.subtitle || '';
    document.getElementById('spSkip').textContent    = v.button || 'Enter app ›';
    buildContact(v);
    resolvePhotos(v.photos, function(available){ buildPhotos(available); i = 0; setActive(0); });
  }

  function openSplash(){
    clearInterval(rotateId); clearTimeout(dismissId);
    renderVariant(ABOUT[pickAboutVariant()] || ABOUT.DEFAULT);
    i = 0;
    document.body.classList.add('splash-lock');
    splash.classList.remove('hide');
    // restart the 10-second countdown progress bar
    prog.classList.remove('run');
    void prog.offsetWidth;                 // force reflow so the reset takes effect
    requestAnimationFrame(function(){ prog.classList.add('run'); });
    // cycle the photos across the 10 seconds (~2.4s each)
    rotateId = setInterval(function(){
      if(photoEls.length){ i = (i + 1) % photoEls.length; setActive(i); }
    }, 2400);
    dismissId = setTimeout(dismissSplash, 10000); // auto-close after 10 seconds
  }

  function dismissSplash(){
    clearInterval(rotateId); clearTimeout(dismissId);
    splash.classList.add('hide');
    document.body.classList.remove('splash-lock');
  }

  document.getElementById('spSkip').addEventListener('click', dismissSplash);
  window.openAbout = openSplash;   // let the bottom "About" button reopen the intro
  openSplash();                    // show on launch
})();
</script>
