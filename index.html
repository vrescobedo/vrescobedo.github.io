<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1f5c3f" />
<meta name="description" content="Record your tennis matches, opponents and practice sessions, and track your stats." />
<title>MyTennisApp</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MyTennisApp" />
<style>
  :root{
    --green:#1f5c3f; --green-dark:#103227; --lime:#c9e86b; --lime-dark:#9fce3a;
    --bg:#f4f6f4; --card:#ffffff; --ink:#1b2420; --muted:#6b7a72; --line:#e2e8e3;
    --win:#1f8a52; --loss:#c0453b; --shadow:0 2px 10px rgba(16,50,39,.08);
  }
  :root[data-theme="dark"]{
    --green:#3f9e68; --green-dark:#0c241b; --lime:#c9e86b; --lime-dark:#9fce3a;
    --bg:#0f1512; --card:#19211d; --ink:#e9efeb; --muted:#8ea298; --line:#28322c;
    --win:#3ab06e; --loss:#e0695f; --shadow:0 2px 12px rgba(0,0,0,.42);
  }
  :root[data-theme="dark"] .bar-track{background:#222b26}
  :root[data-theme="dark"] .drange .clr{background:#222b26}
  :root[data-theme="dark"] .btn.ghost{background:#222b26}
  :root[data-theme="dark"] .tag{background:#222b26}
  :root[data-theme="dark"] .pill.neutral{background:#222b26}
  :root[data-theme="dark"] .pill.win{background:rgba(58,176,110,.18);color:#6fd39a}
  :root[data-theme="dark"] .pill.loss{background:rgba(224,105,95,.18);color:#f0897f}
  :root[data-theme="dark"] .btn.danger{background:rgba(224,105,95,.16)}
  :root[data-theme="dark"] input,:root[data-theme="dark"] select,:root[data-theme="dark"] textarea{background:#141b17}
  :root[data-theme="dark"] .seg label{background:#141b17}
  :root[data-theme="dark"] .chips label{background:#141b17}
  :root[data-theme="dark"] .stat.win{background:linear-gradient(160deg,#16281e,#19211d);border-color:#27482f}
  :root[data-theme="dark"] .av{background:#20302a}
  :root[data-theme="dark"] .badge.r{background:#222b26}
  :root[data-theme="dark"] .badge.l{background:rgba(224,169,66,.16);color:#e0a942}
  :root[data-theme="dark"] .chip{background:#222b26}
  :root[data-theme="dark"] .rec.win{background:rgba(58,176,110,.18);color:#6fd39a}
  :root[data-theme="dark"] .rec.loss{background:rgba(224,105,95,.18);color:#f0897f}
  :root[data-theme="dark"] .rec.even{background:#222b26}
  :root[data-theme="dark"] .rm .p.win{background:rgba(58,176,110,.18);color:#6fd39a}
  :root[data-theme="dark"] .rm .p.loss{background:rgba(224,105,95,.18);color:#f0897f}
  :root[data-theme="dark"] .hstat .n{color:#5cc985}
  :root[data-theme="dark"] .fchip{background:#1e2b23;color:#6fd39a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--ink);padding-bottom:76px;line-height:1.45}
  header{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;
    padding:16px 16px calc(14px + env(safe-area-inset-top)) 16px;padding-top:calc(16px + env(safe-area-inset-top));
    position:sticky;top:0;z-index:20;box-shadow:var(--shadow)}
  header .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  header h1{font-size:19px;margin:0;display:flex;align-items:center;gap:9px;font-weight:700}
  .greet{margin-top:8px;font-size:14px;font-weight:500;color:rgba(255,255,255,.9)}
  .ball{width:22px;height:22px;border-radius:50%;background:var(--lime);position:relative;flex:0 0 auto}
  .ball::before,.ball::after{content:"";position:absolute;inset:0;border:2px solid var(--green-dark);
    border-radius:50%;clip-path:inset(0 50% 0 0)}
  .ball::after{clip-path:inset(0 0 0 50%)}
  .hbtns{display:flex;gap:8px}
  .hbtn{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:9px;padding:7px 10px;
    font-size:12.5px;font-weight:600;cursor:pointer}
  .hbtn:active{background:rgba(255,255,255,.28)}
  main{max-width:760px;margin:0 auto;padding:14px}
  .view{display:none}.view.active{display:block}
  h2.sec{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 2px 10px}
  /* dashboard */
  .dfilter{display:flex;gap:5px;background:var(--card);padding:5px;border-radius:12px;box-shadow:var(--shadow);margin-bottom:14px}
  .dfilter button{flex:1;border:0;background:none;padding:10px 6px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer}
  .dfilter button.on{background:var(--green);color:#fff}
  .drange{display:flex;align-items:flex-end;gap:8px;margin-bottom:14px}
  .drange label{flex:1;margin:0;font-size:11.5px;color:var(--muted);font-weight:600}
  .drange input{margin-top:3px;padding:9px}
  .drange .clr{flex:0 0 auto;width:auto;border:0;background:#eef2ee;color:var(--ink);font-weight:700;
    padding:10px 13px;border-radius:9px;cursor:pointer;font-size:13px}
  .dpresets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .dpresets button{flex:1;min-width:calc(50% - 3px);border:1px solid var(--line);background:var(--card);
    color:var(--muted);font-weight:700;font-size:12.5px;padding:9px 6px;border-radius:20px;cursor:pointer}
  .dpresets button.on{background:var(--green);color:#fff;border-color:transparent}
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:16px}
  .stat{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
  .stat .n{font-size:26px;font-weight:800;color:var(--green)}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px}
  .stat.win{background:linear-gradient(160deg,#f2f9f3,#ffffff);border:1px solid #e0efe4}
  .stat.win .n{color:var(--win)}
  .stat .delta{font-size:11.5px;font-weight:700;margin-top:5px;display:flex;align-items:center;gap:3px;flex-wrap:wrap}
  .stat .delta.up{color:var(--win)}
  .stat .delta.down{color:var(--loss)}
  .stat .delta.flat{color:var(--muted)}
  .stat .delta .dl2{color:var(--muted);font-weight:600;font-size:10.5px}
  .bar-wrap{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:16px}
  .bar-wrap h3{margin:0 0 12px;font-size:13.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .bar-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .bar-row .lbl{width:92px;flex:0 0 auto;color:var(--ink)}
  .bar-track{flex:1;background:#eef2ee;border-radius:6px;height:16px;overflow:hidden}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--lime-dark),var(--green));border-radius:6px}
  .bar-row .val{width:52px;text-align:right;color:var(--muted);flex:0 0 auto}
  /* cards / lists */
  .item{background:var(--card);border-radius:13px;padding:13px 14px;box-shadow:var(--shadow);margin-bottom:10px;
    display:flex;align-items:flex-start;gap:12px;cursor:pointer}
  .item:active{transform:scale(.995)}
  .item .main{flex:1;min-width:0}
  .item .t{font-weight:700;font-size:15px}
  .item .s{font-size:12.5px;color:var(--muted);margin-top:3px}
  .item.match{border-left:4px solid var(--line)}
  .item.match.res-win{border-left-color:var(--win)}
  .item.match.res-loss{border-left-color:var(--loss)}
  .mrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .mscore{font-size:14px;font-weight:600;margin-top:5px}
  .mtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .tag{font-size:11.5px;font-weight:600;color:var(--muted);background:#eef2ee;border-radius:7px;padding:3px 8px}
  /* opponents tab */
  .sechead{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 10px}
  .sechead .sec{margin:0}
  .count{font-size:12.5px;color:var(--muted);font-weight:600}
  .oppsearch{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
  .oppsearch input{border:0;background:none;flex:1;font-size:14px;color:var(--ink);padding:0}
  .oppsearch input:focus{outline:none}
  .sorts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .sorts button{border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:700;font-size:12px;padding:7px 12px;border-radius:20px;cursor:pointer}
  .sorts button.on{background:var(--green);color:#fff;border-color:transparent}
  .op{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:11px;cursor:pointer}
  .op:active{transform:scale(.995)}
  .op .main{flex:1;min-width:0}
  .op .t{font-weight:700;font-size:15.5px}
  .av{width:42px;height:42px;border-radius:50%;background:#eaf3ec;color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:0 0 auto}
  .av.lg{width:56px;height:56px;font-size:20px}
  .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  .badge{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px}
  .badge.r{background:#eef2ee;color:var(--muted)}
  .badge.l{background:#fdf1dd;color:#b7791f}
  .chip{font-size:11.5px;font-weight:600;color:var(--muted);background:#eef2ee;border-radius:7px;padding:2px 8px}
  .op .note{font-size:12px;color:var(--muted);margin-top:6px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rec{font-size:12.5px;font-weight:800;padding:5px 11px;border-radius:20px;white-space:nowrap;flex:0 0 auto}
  .rec.win{background:#e3f4ea;color:var(--win)}
  .rec.loss{background:#fbe6e4;color:var(--loss)}
  .rec.even{background:#eef2ee;color:var(--muted)}
  .pf-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .pf-name{font-size:19px;font-weight:800}
  .hstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
  .hstat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 10px;text-align:center}
  .hstat .n{font-size:22px;font-weight:800;color:var(--green)}
  .hstat.win .n{color:var(--win)}
  .hstat .l{font-size:11px;color:var(--muted);margin-top:3px}
  .hlbl{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:2px 2px 9px}
  .rm{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:9px;border-left:4px solid var(--line)}
  .rm.win{border-left-color:var(--win)}
  .rm.loss{border-left-color:var(--loss)}
  .rm .d{font-size:12px;color:var(--muted);font-weight:600;width:52px;flex:0 0 auto}
  .rm .sc{flex:1;font-size:13.5px;font-weight:600}
  .rm .su{font-size:11px;color:var(--muted);font-weight:600}
  .rm .p{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px}
  .rm .p.win{background:#e3f4ea;color:var(--win)}
  .rm .p.loss{background:#fbe6e4;color:var(--loss)}
  .notecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.5}
  /* practices tab */
  .wcard{background:var(--card);border-radius:14px;padding:14px 16px 12px;box-shadow:var(--shadow);margin-bottom:18px}
  .wcard h3{margin:0 0 2px;font-size:12.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .wcap{font-size:12px;color:var(--muted);margin-bottom:12px}
  .wcap b{color:var(--ink);font-weight:700}
  .wchart{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:92px}
  .wchart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
  .wchart .cn{font-size:11px;font-weight:800;color:var(--muted)}
  .wchart .bar{width:100%;max-width:26px;background:linear-gradient(180deg,var(--lime-dark),var(--green));border-radius:6px 6px 3px 3px}
  .wchart .col.now .cn{color:var(--green)}
  .wchart .col.now .bar{background:var(--green)}
  .wchart .cl{font-size:10px;color:var(--muted);font-weight:600}
  .wchart .col.now .cl{color:var(--green);font-weight:800}
  .wk{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 10px}
  .wk-t{font-size:14px;font-weight:800}
  .wk-s{font-size:12px;color:var(--muted);font-weight:600}
  .pr{display:flex;align-items:flex-start;gap:12px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:13px 14px;margin-bottom:11px;cursor:pointer}
  .pr:active{transform:scale(.995)}
  .pr .main{flex:1;min-width:0}
  .pr .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pr .t{font-weight:700;font-size:15.5px}
  .dur{font-size:12.5px;font-weight:700;color:var(--green);white-space:nowrap;flex:0 0 auto}
  .mchip{font-size:12px;color:var(--muted);font-weight:600}
  .inten{letter-spacing:1.5px;color:var(--green);font-size:12px}
  .inten .off{color:var(--line)}
  .focus{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .fchip{font-size:11.5px;font-weight:700;color:var(--green);background:#eaf3ec;border-radius:7px;padding:3px 9px}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .pill.win{background:#e3f4ea;color:var(--win)}
  .pill.loss{background:#fbe6e4;color:var(--loss)}
  .pill.neutral{background:#eef2ee;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px}
  .empty .big{font-size:40px;margin-bottom:8px}
  /* fab */
  .fab{position:fixed;right:18px;bottom:88px;width:56px;height:56px;border-radius:50%;
    background:var(--green);color:#fff;border:0;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(16,50,39,.35);
    cursor:pointer;z-index:30;display:flex;align-items:center;justify-content:center}
  .fab:active{background:var(--green-dark)}
  /* bottom nav */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
    display:flex;z-index:25;padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs button{flex:1;background:none;border:0;padding:9px 4px 7px;color:var(--muted);font-size:11px;
    display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-weight:600}
  nav.tabs button .ic{font-size:20px;display:flex;align-items:center;justify-content:center;height:22px}
  nav.tabs button .ic svg{width:22px;height:22px;display:block}
  nav.tabs button.on{color:var(--green)}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(16,50,39,.45);display:none;z-index:40;align-items:flex-end;justify-content:center}
  .modal-bg.show{display:flex}
  .modal{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;
    padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  @media(min-width:600px){.modal-bg{align-items:center}.modal{border-radius:18px;max-height:88vh}}
  .modal h3{margin:2px 0 14px;font-size:18px}
  label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin:11px 0 4px}
  input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;
    font-size:15px;font-family:inherit;background:#fbfdfb;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--lime-dark);border-color:transparent}
  textarea{min-height:64px;resize:vertical}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:4px}
  .seg input{display:none}
  .seg label{flex:1;margin:0;text-align:center;padding:11px;font-size:14.5px;color:var(--muted);
    font-weight:700;cursor:pointer;background:#fbfdfb}
  .seg input:checked + label{background:var(--green);color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .chips input{display:none}
  .chips label{margin:0;padding:9px 14px;border:1px solid var(--line);border-radius:999px;
    font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;background:#fbfdfb}
  .chips input:checked + label{background:var(--green);color:#fff;border-color:transparent}
  .modal-actions{display:flex;gap:10px;margin-top:18px}
  .btn{flex:1;padding:13px;border-radius:11px;border:0;font-size:15px;font-weight:700;cursor:pointer}
  .btn.primary{background:var(--green);color:#fff}
  .btn.primary:active{background:var(--green-dark)}
  .btn.ghost{background:#eef2ee;color:var(--ink)}
  .btn.danger{background:#fbe6e4;color:var(--loss);flex:0 0 auto;padding:13px 16px}
  .menu-sheet button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
    padding:14px 6px;font-size:15px;cursor:pointer;color:var(--ink)}
  .menu-sheet button:last-child{border-bottom:0}
  .hint{font-size:11.5px;color:var(--muted);margin-top:5px}
  .fileimport{display:none}
  /* ---------------- practice celebration ---------------- */
  #celebrate{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;pointer-events:none}
  #celebrate.show{display:flex;pointer-events:auto}
  #celebrateCanvas{position:absolute;inset:0;width:100%;height:100%}
  .cel-card{position:relative;background:rgba(16,50,39,.93);color:#fff;border-radius:20px;
    padding:24px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45);
    border:2px solid rgba(201,232,107,.45);max-width:82vw;animation:celPop .5s cubic-bezier(.2,1.3,.4,1)}
  @keyframes celPop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  .cel-emoji{font-size:62px;line-height:1;margin-bottom:6px;animation:celBounce 1s ease infinite}
  @keyframes celBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .cel-title{font-size:22px;font-weight:800;color:var(--lime)}
  .cel-msg{font-size:14.5px;margin-top:6px;color:#dff0e4;max-width:280px}
  .cel-badge{display:inline-block;margin-top:13px;background:var(--lime);color:var(--green-dark);
    font-weight:800;font-size:12.5px;padding:6px 13px;border-radius:999px;letter-spacing:.02em}
  .cel-badge[hidden]{display:none}
  .cel-tap{font-size:11px;color:#a9c9b6;margin-top:12px}
  @media (prefers-reduced-motion: reduce){ .cel-emoji,.cel-card{animation:none} }
  /* ---------------- intro / splash ---------------- */
  #splash{position:fixed;inset:0;z-index:9999;
    background:linear-gradient(160deg,#2a6a49 0%,var(--green) 30%,var(--green-dark) 72%,#0b241b 100%);
    color:#fff;display:flex;align-items:center;justify-content:center;
    padding:calc(22px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom));
    opacity:1;transition:opacity .5s ease}
  #splash.hide{opacity:0;pointer-events:none}
  .sp-inner{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .sp-brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800;letter-spacing:.02em;
    color:#eafbef;opacity:.95;margin-bottom:16px}
  .sp-ball{width:20px;height:20px;border-radius:50%;background:var(--lime);position:relative;flex:0 0 auto}
  .sp-ball::before,.sp-ball::after{content:"";position:absolute;inset:0;border:2px solid var(--green-dark);
    border-radius:50%;clip-path:inset(0 50% 0 0)}
  .sp-ball::after{clip-path:inset(0 0 0 50%)}
  .sp-photos{position:relative;width:100%;aspect-ratio:3/2;border-radius:18px;overflow:hidden;
    background:#0b241b;box-shadow:0 14px 40px rgba(0,0,0,.45);border:2px solid rgba(201,232,107,.35)}
  .sp-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease}
  .sp-photo.on{opacity:1}
  .sp-photos.sp-hide{display:none}
  .sp-sub:empty{display:none}
  .sp-dots{position:absolute;left:0;right:0;bottom:10px;display:flex;gap:7px;justify-content:center;z-index:2}
  .sp-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45);transition:all .3s}
  .sp-dot.on{background:var(--lime);width:20px;border-radius:4px}
  .sp-tagline{margin-top:18px;font-size:12px;text-transform:uppercase;letter-spacing:.14em;
    color:var(--lime);font-weight:700}
  .sp-name{font-size:26px;font-weight:800;margin-top:5px;line-height:1.15}
  .sp-sub{font-size:13.5px;color:#cfe6d7;margin-top:6px}
  .sp-contact{margin-top:18px;width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
    border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
  .sp-row{display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:700;
    color:#fff;text-decoration:none}
  .sp-row .sp-ic{font-size:17px}
  .sp-row.tel{color:var(--lime)}
  .sp-skip{margin-top:20px;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:24px;
    padding:11px 26px;font-size:14px;font-weight:700;cursor:pointer}
  .sp-skip:active{background:rgba(255,255,255,.26)}
  .sp-progress{margin-top:16px;width:120px;height:4px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
  .sp-progbar{height:100%;width:0;background:var(--lime);border-radius:3px}
  .sp-progbar.run{width:100%;transition:width 10s linear}
  body.splash-lock{overflow:hidden}
  @media (max-height:640px){
    .sp-name{font-size:22px}.sp-brand{margin-bottom:10px}.sp-tagline{margin-top:12px}
    .sp-contact{margin-top:12px}.sp-skip{margin-top:12px}
  }
</style>
<script>(function(){try{var p=localStorage.getItem('tennis_theme')||'system';var d=p==='dark'||(p==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();</script>
</head>
<body>
<!-- =============== INTRO / ABOUT (10s on launch; content by device timezone) =============== -->
<div id="splash" role="dialog" aria-label="MyTennisApp intro">
  <div class="sp-inner">
    <div class="sp-brand"><span class="sp-ball"></span> MyTennisApp</div>
    <div class="sp-photos" id="spPhotos"></div>
    <div class="sp-tagline" id="spTagline"></div>
    <div class="sp-name" id="spName"></div>
    <div class="sp-sub" id="spSub"></div>
    <div class="sp-contact" id="spContact"></div>
    <button class="sp-skip" id="spSkip" type="button">Enter app ›</button>
    <div class="sp-progress"><div class="sp-progbar" id="spProg"></div></div>
  </div>
</div>

<header>
  <div class="row">
    <h1><span class="ball"></span> MyTennisApp</h1>
    <div class="hbtns">
      <button class="hbtn" onclick="openMenu()">Data ▾</button>
    </div>
  </div>
  <div class="greet" id="helloName"></div>
</header>

<main>
  <!-- DASHBOARD -->
  <section id="v-dash" class="view active">
    <div class="dfilter" id="dashFilter">
      <button data-f="all" class="on" onclick="setDashFilter('all')">All</button>
      <button data-f="Singles" onclick="setDashFilter('Singles')">Singles</button>
      <button data-f="Doubles" onclick="setDashFilter('Doubles')">Doubles</button>
    </div>
    <div class="dpresets" id="dashPresets">
      <button data-p="7" onclick="applyPreset('7')">Last 7 days</button>
      <button data-p="30" onclick="applyPreset('30')">Last 30 days</button>
      <button data-p="90" onclick="applyPreset('90')">Last 90 days</button>
      <button data-p="year" onclick="applyPreset('year')">Last Year</button>
    </div>
    <div class="drange">
      <label>From<input type="date" id="dashFrom" onchange="setDashRange()"></label>
      <label>To<input type="date" id="dashTo" onchange="setDashRange()"></label>
      <button class="clr" onclick="clearDashRange()">Clear</button>
    </div>
    <div class="stat-grid" id="statGrid"></div>
    <div class="bar-wrap"><h3>Results by surface</h3><div id="surfaceBars"></div></div>
    <div class="bar-wrap"><h3>Top opponents (head-to-head)</h3><div id="oppBars"></div></div>
    <div class="bar-wrap"><h3>Practice focus (% of time)</h3><div id="focusBars"></div></div>
  </section>

  <!-- MATCHES -->
  <section id="v-matches" class="view">
    <h2 class="sec">Matches</h2>
    <div id="matchList"></div>
  </section>

  <!-- OPPONENTS -->
  <section id="v-opponents" class="view">
    <div class="sechead"><h2 class="sec">Opponents</h2><span class="count" id="oppCount"></span></div>
    <div id="oppControls">
      <div class="oppsearch">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none"><circle cx="11" cy="11" r="7" stroke="var(--muted)" stroke-width="1.8"/><path d="M20 20l-3.2-3.2" stroke="var(--muted)" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="oppSearchInput" type="text" placeholder="Search opponents" oninput="setOppSearch(this.value)">
      </div>
      <div class="sorts" id="oppSorts">
        <button data-s="name" class="on" onclick="setOppSort('name')">Name</button>
        <button data-s="played" onclick="setOppSort('played')">Most played</button>
        <button data-s="record" onclick="setOppSort('record')">Best record</button>
        <button data-s="recent" onclick="setOppSort('recent')">Recent</button>
      </div>
    </div>
    <div id="oppList"></div>
  </section>

  <!-- PRACTICES -->
  <section id="v-practices" class="view">
    <div class="sechead"><h2 class="sec">Practices</h2><span class="count" id="pracCount"></span></div>
    <div id="pracList"></div>

<button class="fab" id="fab" onclick="addCurrent()">+</button>

<nav class="tabs">
  <button data-v="dash" class="on" onclick="show('dash')"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20V10M10 20V4M16 20v-7M4 20h16" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span>Dashboard</button>
  <button data-v="matches" onclick="show('matches')"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.7"/><path d="M5.2 6.9c2.7 1.9 2.7 8.3 0 10.2M18.8 6.9c-2.7 1.9-2.7 8.3 0 10.2" stroke="currentColor" stroke-width="1.7"/></svg></span>Matches</button>
  <button data-v="opponents" onclick="show('opponents')"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>Opponents</button>
  <button data-v="practices" onclick="show('practices')"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12h3l2.5-6 4 13 2.5-7H21" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Practices</button>
  <button onclick="openAbout()"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.4" stroke="currentColor" stroke-width="1.7"/><path d="M12 11v5M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>About</button>
</nav>

<!-- MODAL -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<input type="file" id="fileImport" class="fileimport" accept="application/json" onchange="doImport(event)" />

<!-- ===================== PRACTICE CELEBRATION ===================== -->
<div id="celebrate" aria-hidden="true">
  <canvas id="celebrateCanvas"></canvas>
  <div class="cel-card">
    <div class="cel-emoji" id="celEmoji">🎾</div>
    <div class="cel-title" id="celTitle">Nice work!</div>
    <div class="cel-msg" id="celMsg"></div>
    <div class="cel-badge" id="celBadge" hidden></div>
    <div class="cel-tap">tap to continue</div>
  </div>
</div>

<script>
/* ---------------- storage ---------------- */
const K = {m:'tennis_matches', o:'tennis_opponents', p:'tennis_practices'};
const load = k => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch(e){ return []; } };
const save = (k,v) => localStorage.setItem(k, JSON.stringify(v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

let matches = load(K.m), opponents = load(K.o), practices = load(K.p);

/* seed example data on very first run */
if(!localStorage.getItem('tennis_seeded')){
  opponents = [{id:uid(),name:'Rajiv Sharma',club:'DLTA',hand:'Right',level:'Intermediate',city:'New Delhi',contact:'',notes:'Strong forehand, slower to the net'}];
  matches = [{id:uid(),date:'2026-08-08',opponent:'Rajiv Sharma',type:'Competitive',surface:'Hard',location:'DLTA, New Delhi',score:'6-4 3-6 6-2',result:'Win',setsW:2,setsL:1,duration:95,notes:'Served well; backhand under pressure needs work'}];
  practices = [{id:uid(),date:'2026-08-07',focus:'Serve + Forehand',duration:75,with:'Coach Anil',location:'DLTA, New Delhi',intensity:4,notes:'200 serves; worked on toss consistency'}];
  save(K.m,matches);save(K.o,opponents);save(K.p,practices);
  localStorage.setItem('tennis_seeded','1');
}

/* ---------------- player profile ---------------- */
const PROFILE_KEY = 'tennis_profile';
function loadProfile(){ try{ return JSON.parse(localStorage.getItem(PROFILE_KEY)) || null; }catch(e){ return null; } }
function saveProfileData(p){ localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); }
function hasProfile(){ return !!(profile && profile.firstName && String(profile.firstName).trim()); }
let profile = loadProfile();
let onboarding = false;
function greetWord(){
  const h = new Date().getHours();
  if(h < 12) return 'Good morning';
  if(h < 18) return 'Good afternoon';
  return 'Good evening';
}
function renderHello(){
  const el = document.getElementById('helloName');
  if(!el) return;
  if(profile && profile.firstName){ el.textContent = greetWord() + ', ' + profile.firstName + '!'; el.style.display=''; }
  else { el.textContent=''; el.style.display='none'; }
}
/* ---------------- appearance (light / dark) ---------------- */
function applyTheme(){
  let pref='system'; try{ pref=localStorage.getItem('tennis_theme')||'system'; }catch(e){}
  const dark = pref==='dark' || (pref==='system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark?'dark':'light');
}
function themeLabel(){ let p='system'; try{ p=localStorage.getItem('tennis_theme')||'system'; }catch(e){} return p==='system'?'System':(p==='dark'?'Dark':'Light'); }
function cycleTheme(){
  const order=['system','light','dark'];
  let p='system'; try{ p=localStorage.getItem('tennis_theme')||'system'; }catch(e){}
  p = order[(order.indexOf(p)+1)%order.length];
  try{ localStorage.setItem('tennis_theme', p); }catch(e){}
  applyTheme();
  const b=document.getElementById('themeToggleBtn'); if(b) b.textContent='🌗 Appearance: '+themeLabel();
}
if(window.matchMedia){ try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ let p='system'; try{ p=localStorage.getItem('tennis_theme')||'system'; }catch(e){} if(p==='system') applyTheme(); }); }catch(e){} }
function profileFormHTML(p, isSetup){
  p = p || {};
  return `
    <h3>${isSetup ? 'Welcome to MyTennisApp' : 'Player profile'}</h3>
    ${isSetup ? '<p class="hint">Tell us about you, the tennis player. You can update this anytime from the Data menu.</p>' : ''}
    <div class="two">
      <div><label>First name</label><input id="f_pfirst" value="${esc(p.firstName||'')}"></div>
      <div><label>Last name</label><input id="f_plast" value="${esc(p.lastName||'')}"></div>
    </div>
    <div class="two">
      <div><label>Playing hand</label><select id="f_phand">${optionList(['Right','Left'], p.hand||'Right')}</select></div>
      <div><label>UTR (Universal Tennis Rating)</label><input id="f_putr" type="number" step="0.01" min="1" max="16.5" value="${esc(p.utr==null?'':p.utr)}" placeholder="e.g. 6.25"></div>
    </div>
    <div class="modal-actions">
      ${isSetup ? '' : '<button class="btn ghost" onclick="closeModal()">Cancel</button>'}
      <button class="btn primary" onclick="saveProfileForm(${isSetup ? 'true' : 'false'})">${isSetup ? 'Get started' : 'Save'}</button>
    </div>`;
}
function openProfileSetup(){ onboarding = true; openModal(profileFormHTML(profile||{}, true)); }
function editProfile(){ openModal(profileFormHTML(profile||{}, false)); }
function saveProfileForm(isSetup){
  const first = val('f_pfirst'), last = val('f_plast');
  if(!first){ alert('Please enter your first name.'); return; }
  if(!last){ alert('Please enter your last name.'); return; }
  profile = { firstName:first, lastName:last, hand:(val('f_phand')||'Right'), utr:val('f_putr') };
  saveProfileData(profile);
  onboarding = false;
  closeModal();
  renderHello();
}

/* ---------------- view switching ---------------- */
let current = 'dash';
let dashFilter = 'all';   // 'all' | 'Singles' | 'Doubles' — dashboard stats filter
let dashFrom = '';        // dashboard date-range start (YYYY-MM-DD); '' = open
let dashTo   = '';        // dashboard date-range end   (YYYY-MM-DD); '' = open
let dashPreset = '';      // '' | '30' | '60' | '90' | 'year' — active quick preset
let celebrateSound = (localStorage.getItem('tennis_sound') !== 'off'); // celebration fanfare on/off (default on)
function setDashFilter(f){
  dashFilter = f;
  document.querySelectorAll('#dashFilter button').forEach(b=>b.classList.toggle('on', b.dataset.f===f));
  renderDash();
}
function isoDay(dt){ const z=new Date(dt.getTime()-dt.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function presetRange(preset){
  const today=new Date(), to=isoDay(today);
  let from;
  if(preset==='year'){ const d=new Date(today); d.setDate(d.getDate()-364); from=isoDay(d); }
  else { const d=new Date(today); d.setDate(d.getDate()-(+preset-1)); from=isoDay(d); }
  return {from,to};
}
function markActivePreset(){
  document.querySelectorAll('#dashPresets button').forEach(b=>b.classList.toggle('on', b.dataset.p===dashPreset));
}
function saveDashRange(){ save('tennis_dashrange', {preset:dashPreset, from:dashFrom, to:dashTo}); }
function reflectRangeInputs(){
  document.getElementById('dashFrom').value = dashFrom;
  document.getElementById('dashTo').value   = dashTo;
  markActivePreset();
}
function applyPreset(preset, doRender=true){
  dashPreset = preset;
  const r = presetRange(preset);
  dashFrom = r.from; dashTo = r.to;
  reflectRangeInputs();
  saveDashRange();
  if(doRender) renderDash();
}
function setDashRange(){
  dashFrom = document.getElementById('dashFrom').value;
  dashTo   = document.getElementById('dashTo').value;
  dashPreset = '';
  markActivePreset();
  saveDashRange();
  renderDash();
}
function clearDashRange(){
  dashFrom=''; dashTo=''; dashPreset='';
  reflectRangeInputs();
  saveDashRange();
  renderDash();
}
function restoreDashRange(){
  let r=null; try{ r=JSON.parse(localStorage.getItem('tennis_dashrange')); }catch(e){}
  if(!r){ applyPreset('7', false); return; }   /* default to Last 7 days on first open */
  if(r.preset){ applyPreset(r.preset, false); }
  else { dashFrom=r.from||''; dashTo=r.to||''; reflectRangeInputs(); }
}
function inDashRange(d){
  if(dashFrom && (!d || d<dashFrom)) return false;
  if(dashTo   && (!d || d>dashTo))   return false;
  return true;
}
function show(v){
  current = v;
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('active'));
  document.getElementById('v-'+v).classList.add('active');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  document.getElementById('fab').style.display = (v==='dash') ? 'none' : 'flex';
  render();
  window.scrollTo(0,0);
}
function addCurrent(){
  if(current==='matches') editMatch();
  else if(current==='opponents') editOpponent();
  else if(current==='practices') editPractice();
}

/* ---------------- helpers ---------------- */
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byDateDesc = (a,b)=> ((b.date||'')+'T'+(b.time||'')).localeCompare((a.date||'')+'T'+(a.time||''));
function fmtDate(d){ if(!d) return ''; const dt=new Date(d+'T00:00:00'); return isNaN(dt)?d:dt.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }
/* parse a score string like "6-4 3-6 7-6(5)" -> sets & games won/lost (your games first) */
function parseScore(score){
  if(!score) return null;
  let sW=0,sL=0,gW=0,gL=0,found=false;
  score.trim().split(/\s+/).forEach(tok=>{
    const cleaned = tok.replace(/\([^)]*\)/g,''); // drop tiebreak marker e.g. (5)
    const mm = cleaned.match(/^(\d+)-(\d+)$/);
    if(mm){ found=true; const a=+mm[1], b=+mm[2]; gW+=a; gL+=b; if(a>b)sW++; else if(b>a)sL++; }
  });
  return found ? {setsW:sW,setsL:sL,gamesW:gW,gamesL:gL} : null;
}
function metricsFor(mset,pset){
  const total=mset.length;
  const wins=mset.filter(m=>m.result==='Win').length;
  const losses=mset.filter(m=>m.result==='Loss').length;
  let setsW=0,setsL=0,gamesW=0,gamesL=0;
  mset.forEach(m=>{ const p=parseScore(m.score);
    if(p){ setsW+=p.setsW; setsL+=p.setsL; gamesW+=p.gamesW; gamesL+=p.gamesL; }
    else { setsW+=(+m.setsW||0); setsL+=(+m.setsL||0); } });
  const winPct=(wins+losses)?wins/(wins+losses)*100:0;
  const setPct=(setsW+setsL)?setsW/(setsW+setsL)*100:0;
  const gamePct=(gamesW+gamesL)?gamesW/(gamesW+gamesL)*100:0;
  const mins=pset.reduce((s,p)=>s+(+p.duration||0),0);
  return {total,wins,losses,setsW,setsL,gamesW,gamesL,winPct,setPct,gamePct,sessions:pset.length,mins};
}
function pctDelta(cur,prev){
  if(prev==null) return null;
  if(prev===0){ if(!cur) return null; return {txt:'new',up:true}; }
  const r=Math.round((cur-prev)/Math.abs(prev)*100);
  return {txt:Math.abs(r)+'%', up: r>0?true:(r<0?false:null)};
}

/* ---------------- render ---------------- */
function render(){
  if(current==='dash') renderDash();
  if(current==='matches') renderMatches();
  if(current==='opponents') renderOpponents();
  if(current==='practices') renderPractices();
}

function renderDash(){
  // apply the All / Singles / Doubles filter (matches with no format count as Singles)
  const ms = matches.filter(m => (dashFilter==='all' ? true : (m.format||'Singles')===dashFilter) && inDashRange(m.date));
  const ps = practices.filter(p => inDashRange(p.date));
  const cur = metricsFor(ms, ps);
  const total=cur.total, wins=cur.wins, losses=cur.losses, rate=Math.round(cur.winPct);
  const setsW=cur.setsW, setsL=cur.setsL, gamesW=cur.gamesW, gamesL=cur.gamesL, mins=cur.mins;
  const oppFaced = new Set(ms.map(m=>m.opponent).filter(Boolean)).size;

  // previous period: same-length window immediately before the selected range (only when a bounded range is active)
  let prev=null;
  if(dashFrom && dashTo){
    const MS=86400000, f=new Date(dashFrom+'T00:00:00');
    const days=Math.round((new Date(dashTo+'T00:00:00')-f)/MS)+1;
    const pTo=isoDay(new Date(f.getTime()-MS));
    const pFrom=isoDay(new Date(f.getTime()-days*MS));
    const inPrev=d=> d && d>=pFrom && d<=pTo;
    const pm=matches.filter(m=>(dashFilter==='all'?true:(m.format||'Singles')===dashFilter) && inPrev(m.date));
    const pp=practices.filter(p=>inPrev(p.date));
    prev=metricsFor(pm,pp);
  }
  const dl=(c,p)=> prev ? pctDelta(c,p) : null;
  const stats = [
    {n:total,l:'Matches played', d:dl(cur.total, prev&&prev.total)},
    {n:rate+'%',l:'Win rate',cls:'win', d:dl(cur.winPct, prev&&prev.winPct)},
    {n:wins+'–'+losses,l:'Win – Loss', d:dl(cur.winPct, prev&&prev.winPct)},
    {n:setsW+'–'+setsL,l:'Sets won – lost', d:dl(cur.setPct, prev&&prev.setPct)},
    {n:gamesW+'–'+gamesL,l:'Games won – lost', d:dl(cur.gamePct, prev&&prev.gamePct)},
    {n:oppFaced,l:'Opponents faced'},
    {n:ps.length,l:'Practice sessions', d:dl(cur.sessions, prev&&prev.sessions)},
    {n:(mins>=60?(mins/60).toFixed(1)+'h':mins+'m'),l:'Time practiced', d:dl(cur.mins, prev&&prev.mins)}
  ];
  document.getElementById('statGrid').innerHTML = stats.map(s=>{
    const dd = s.d ? `<div class="delta ${s.d.up===true?'up':(s.d.up===false?'down':'flat')}">${s.d.up===true?'▲':(s.d.up===false?'▼':'')} ${esc(s.d.txt)} <span class="dl2">vs prev</span></div>` : '';
    return `<div class="stat ${s.cls||''}"><div class="n">${esc(s.n)}</div><div class="l">${esc(s.l)}</div>${dd}</div>`;
  }).join('');

  // surface breakdown
  const surf = {};
  ms.forEach(m=>{ const k=m.surface||'—'; surf[k]=surf[k]||{w:0,t:0}; surf[k].t++; if(m.result==='Win')surf[k].w++; });
  const sKeys = Object.keys(surf).sort((a,b)=>surf[b].t-surf[a].t);
  document.getElementById('surfaceBars').innerHTML = sKeys.length ? sKeys.map(k=>{
    const {w,t}=surf[k]; const pct=t?Math.round(w/t*100):0;
    return `<div class="bar-row"><span class="lbl">${esc(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="val">${w}/${t}</span></div>`;
  }).join('') : '<div class="hint">No matches yet.</div>';

  // top opponents
  const opp = {};
  ms.forEach(m=>{ const k=m.opponent||'—'; opp[k]=opp[k]||{w:0,t:0}; opp[k].t++; if(m.result==='Win')opp[k].w++; });
  const oKeys = Object.keys(opp).sort((a,b)=>opp[b].t-opp[a].t).slice(0,6);
  document.getElementById('oppBars').innerHTML = oKeys.length ? oKeys.map(k=>{
    const {w,t}=opp[k]; const pct=t?Math.round(w/t*100):0;
    return `<div class="bar-row"><span class="lbl">${esc(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="val">${w}–${t-w}</span></div>`;
  }).join('') : '<div class="hint">No matches yet.</div>';

  // practice focus: split each session's minutes evenly across its selected strokes
  const strokeMin = {};
  ps.forEach(p=>{
    const dur = +p.duration||0; if(!dur) return;
    const sel = STROKES.filter(st=>focusHas(p.focus,st)); if(!sel.length) return;
    const share = dur/sel.length;
    sel.forEach(st=>{ strokeMin[st]=(strokeMin[st]||0)+share; });
  });
  const focusTot = Object.values(strokeMin).reduce((a,b)=>a+b,0);
  const fKeys = Object.keys(strokeMin).sort((a,b)=>strokeMin[b]-strokeMin[a]);
  document.getElementById('focusBars').innerHTML = focusTot ? fKeys.map(k=>{
    const pct = Math.round(strokeMin[k]/focusTot*100);
    const mm = strokeMin[k];
    const tlabel = mm>=60 ? (mm/60).toFixed(1)+'h' : Math.round(mm)+'m';
    return `<div class="bar-row"><span class="lbl">${esc(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="val" style="width:auto;min-width:82px">${pct}% \u00b7 ${tlabel}</span></div>`;
  }).join('') : '<div class="hint">No practice focus logged yet.</div>';
}

const PR_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none"><path d="M4 12h3l2.5-6 4 13 2.5-7H21" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function weekStart(dt){ const d=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d; }
function weekStartISO(dateStr){ return isoDay(weekStart(new Date(dateStr+'T00:00:00'))); }
function chartLabel(iso){ const dt=new Date(iso+'T00:00:00'); return isNaN(dt)?iso:dt.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function fmtPracDate(iso){ if(!iso) return ''; const dt=new Date(iso+'T00:00:00'); return isNaN(dt)?iso:dt.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}); }
function intensityDots(v){ const n=Math.max(0,Math.min(5,+v||0)); if(!n) return ''; let out='<span class="inten">'; for(let i=0;i<5;i++){ out += i<n?'●':'<span class="off">●</span>'; } return out+'</span>'; }
function practiceCard(p){
  const person = (p.with||'').trim();
  const av = person ? esc(oppInitials(person)) : PR_ICON;
  const title = person ? esc(person) : 'Solo session';
  const dur = p.duration ? esc(p.duration)+' min' : '';
  const dots = intensityDots(p.intensity);
  const strokes = (p.focus||'').split(',').map(x=>x.trim()).filter(Boolean);
  const chips = strokes.map(x=>`<span class="fchip">${esc(x)}</span>`).join('');
  const dateStr = fmtPracDate(p.date);
  return `<div class="pr" onclick="editPractice('${p.id}')">
    <div class="av">${av}</div>
    <div class="main">
      <div class="top"><div class="t">${title}</div>${dur?`<div class="dur">${dur}</div>`:''}</div>
      <div class="meta">${dateStr?`<span class="mchip">${esc(dateStr)}</span>`:''}${dots}</div>
      ${chips?`<div class="focus">${chips}</div>`:''}
    </div></div>`;
}
function renderPractices(){
  const el = document.getElementById('pracList');
  const cEl = document.getElementById('pracCount');
  if(!practices.length){ if(cEl) cEl.textContent=''; el.innerHTML = emptyBox('🏋️','No practices yet','Tap + to log a session.'); return; }
  if(cEl) cEl.textContent = practices.length+' '+(practices.length===1?'session':'sessions');
  const sorted = [...practices].sort(byDateDesc);
  // weekly cadence chart — last 7 weeks
  const thisMon = weekStart(new Date());
  const weeks = [];
  for(let i=6;i>=0;i--){ const d=new Date(thisMon); d.setDate(d.getDate()-i*7); weeks.push(isoDay(d)); }
  const wkCount = {};
  practices.forEach(p=>{ if(!p.date) return; const ws=weekStartISO(p.date); wkCount[ws]=(wkCount[ws]||0)+1; });
  const counts = weeks.map(w=>wkCount[w]||0);
  const maxC = Math.max(1, ...counts);
  const total7 = counts.reduce((a,b)=>a+b,0);
  const avg = (total7/7).toFixed(1);
  const thisCount = wkCount[weeks[6]]||0;
  const chart = `<div class="wcard">
    <h3>Sessions per week</h3>
    <div class="wcap"><b>${thisCount}</b> this week · averaging <b>${avg}</b>/week over 7 weeks</div>
    <div class="wchart">${weeks.map((w,i)=>{
      const c=counts[i]; const h = c===0?4:Math.max(14, Math.round(c/maxC*74));
      const now = i===6;
      const lbl = i===6?'This wk':(i===5?'Last wk':chartLabel(w));
      return `<div class="col${now?' now':''}"><div class="cn">${c}</div><div class="bar" style="height:${h}px"></div><div class="cl">${esc(lbl)}</div></div>`;
    }).join('')}</div>
  </div>`;
  // group sessions by week
  const groups = {};
  sorted.forEach(p=>{ const ws = p.date?weekStartISO(p.date):'nodate'; (groups[ws]=groups[ws]||[]).push(p); });
  const lastMonD = new Date(thisMon); lastMonD.setDate(lastMonD.getDate()-7);
  const lastMon = isoDay(lastMonD);
  const gKeys = Object.keys(groups).sort((a,b)=>{ if(a==='nodate') return 1; if(b==='nodate') return -1; return b.localeCompare(a); });
  const groupsHTML = gKeys.map(ws=>{
    const items = groups[ws];
    const mins = items.reduce((sum,p)=>sum+(+p.duration||0),0);
    const label = ws==='nodate'?'No date':(ws===weeks[6]?'This week':(ws===lastMon?'Last week':'Week of '+chartLabel(ws)));
    const hrs = mins>=60?(mins/60).toFixed(1)+'h':(mins?mins+'m':'');
    const head = `<div class="wk"><div class="wk-t">${label}</div><div class="wk-s">${items.length} session${items.length>1?'s':''}${hrs?' · '+hrs:''}</div></div>`;
    return head + items.map(practiceCard).join('');
  }).join('');
  el.innerHTML = chart + groupsHTML;
}

    <label>Notes</label><textarea id="f_pnotes">${esc(p.notes||'')}</textarea>
    <div class="modal-actions">
      ${id?`<button class="btn danger" onclick="delItem('p','${id}')">Delete</button>`:''}
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="savePractice('${id||''}')">Save</button>
    </div>`);
}
function savePractice(id){
  const rec = {id:id||uid(), date:val('f_pdate'), time:val('f_ptime'), focus:selectedFocus(), duration:val('f_pdur'),
    with:val('f_with'), location:val('f_ploc'), intensity:val('f_intensity'), notes:val('f_pnotes')};
  const isNew = !id;
  if(id){ practices = practices.map(x=>x.id===id?rec:x); } else { practices.push(rec); }
  save(K.p,practices); closeModal(); render();
  if(isNew) celebratePractice();   // 🎾 cheer the user for logging a practice
}

function delItem(kind,id){
  if(!confirm('Delete this entry? This cannot be undone.')) return;
  if(kind==='m'){ matches = matches.filter(x=>x.id!==id); save(K.m,matches); }
  if(kind==='o'){ opponents = opponents.filter(x=>x.id!==id); save(K.o,opponents); }
  if(kind==='p'){ practices = practices.filter(x=>x.id!==id); save(K.p,practices); }
  closeModal(); render();
}

function download(name, text, type){
  const blob = new Blob([text], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}
function exportJSON(){
  download('MyTennisApp_backup_'+new Date().toISOString().slice(0,10)+'.json',
    JSON.stringify({matches,opponents,practices,profile,exported:new Date().toISOString()},null,2),
    'application/json'); closeModal();
}
function csvCell(v){ v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function exportCSV(kind){
  let rows=[], head=[];
  if(kind==='matches'){ head=['Date','Time','Format','Partner','Opponent','Match Type','Surface','Location','Score','Result','Sets Won','Sets Lost','Duration (min)','Notes'];
    rows=[...matches].sort(byDateDesc).map(m=>[m.date,m.time,m.format||'Singles',m.partner,m.opponent,m.type,m.surface,m.location,m.score,m.result,m.setsW,m.setsL,m.duration,m.notes]); }
  if(kind==='opponents'){ head=['Opponent','Club / Team','Handedness','Level / Rating','City','Contact','Notes'];
    rows=opponents.map(o=>[o.name,o.club,o.hand,o.level,o.city,o.contact,o.notes]); }
  if(kind==='practices'){ head=['Practice','Date','Time','Focus','Duration (min)','With','Location','Intensity (1-5)','Notes'];
    rows=[...practices].sort(byDateDesc).map((p,i)=>['P'+String(i+1).padStart(3,'0'),p.date,p.time,p.focus,p.duration,p.with,p.location,p.intensity,p.notes]); }
  const csv=[head, ...rows].map(r=>r.map(csvCell).join(',')).join('\n');
  download('MyTennisApp_'+kind+'.csv', csv, 'text/csv'); closeModal();
}
function doImport(ev){
  const file = ev.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!confirm('Restore backup? This replaces your current data.')) return;
      matches = d.matches||[]; opponents = d.opponents||[]; practices = d.practices||[];
      save(K.m,matches); save(K.o,opponents); save(K.p,practices);
      if(d.profile){ profile = d.profile; saveProfileData(profile); renderHello(); }
      closeModal(); render(); alert('Backup restored.');
    }catch(e){ alert('That file could not be read as a MyTennisApp backup.'); }
    ev.target.value='';
  };
  r.readAsText(file);
}

/* ---------------- practice celebration (confetti + synthesized fanfare) ---------------- */
let _celTimer=null, _celRAF=null, _actx=null;

function _audioCtx(){
  if(_actx) return _actx;
  try{ _actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ _actx=null; }
  return _actx;
}
/* short triumphant fanfare, built live with oscillators — no audio files needed */
function playFanfare(big){
  if(!celebrateSound) return;
  const ac=_audioCtx(); if(!ac) return;
  if(ac.state==='suspended'){ try{ ac.resume(); }catch(e){} }
  const now=ac.currentTime;
  const master=ac.createGain(); master.gain.value=0.22; master.connect(ac.destination);
  function note(freq,start,dur,type){
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'triangle'; o.frequency.value=freq; o.connect(g); g.connect(master);
    const t=now+start;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.5,t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.03);
  }
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>note(f,i*0.11,0.34,'triangle')); // C5 E5 G5 C6
  if(big){
    note(1318.51,0.52,0.5,'triangle'); note(1567.98,0.64,0.55,'triangle'); note(2093.0,0.76,0.6,'triangle');
    [1046.5,1318.51,1567.98].forEach((f,i)=>note(f,0.9+i*0.015,0.9,'sine')); // final chord
  }
}
function _runConfetti(amount){
  const canvas=document.getElementById('celebrateCanvas');
  const ctx=canvas.getContext('2d');
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const W=canvas.clientWidth||window.innerWidth, H=canvas.clientHeight||window.innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const N=reduce?Math.round(amount*0.35):amount;
  const colors=['#c9e86b','#1f8a52','#ffd54a','#ff5e9c','#ffffff','#ff8a3d','#1f5c3f'];
  const parts=[];
  for(let i=0;i<N;i++){
    parts.push({x:W*(0.2+0.6*Math.random()), y:H*0.5-40+(Math.random()*40-20),
      vx:(Math.random()-0.5)*7, vy:-6-Math.random()*7, g:0.18+Math.random()*0.12,
      size:6+Math.random()*7, rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.3,
      color:colors[i%colors.length], life:0, ttl:90+Math.random()*45, shape:Math.random()<0.5?'r':'c'});
  }
  cancelAnimationFrame(_celRAF);
  (function frame(){
    ctx.clearRect(0,0,W,H);
    let alive=false;
    parts.forEach(p=>{
      if(p.life>p.ttl) return; p.life++; alive=true;
      p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.vx*=0.99;
      const a=Math.max(0,1-p.life/p.ttl);
      ctx.save(); ctx.globalAlpha=a; ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.color;
      if(p.shape==='r') ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      else { ctx.beginPath(); ctx.arc(0,0,p.size/2,0,6.28); ctx.fill(); }
      ctx.restore();
    });
    if(alive) _celRAF=requestAnimationFrame(frame); else ctx.clearRect(0,0,W,H);
  })();
}
const CHEERS=[
  "Another session in the books!","Your future self says thanks.","Reps make champions. 💪",
  "That's how progress is built.","Consistency is your superpower.","Great job showing up today!",
  "One more step toward your goals.","Every session counts. Keep going!"
];
function currentStreak(){
  const days=new Set(practices.map(p=>p.date).filter(Boolean));
  if(!days.size) return 0;
  const latest=[...days].sort().pop();
  let streak=0, d=new Date(latest+'T00:00:00');
  while(days.has(isoDay(d))){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}
function celebratePractice(){
  const count=practices.length, streak=currentStreak();
  let emoji='🎾', title='Nice work!', msg=CHEERS[Math.floor(Math.random()*CHEERS.length)], badge='', big=false;
  // milestone (biggest applicable wins)
  if(count===1){ emoji='🎉'; title='First practice logged!'; msg='The journey begins — keep it going!'; badge='🏁 Session #1'; big=true; }
  else if(count%100===0){ emoji='👑'; title=count+' practices!'; msg='Absolutely legendary dedication.'; badge='🏆 '+count+' sessions'; big=true; }
  else if(count%50===0){ emoji='🏆'; title=count+' practices!'; msg='Elite consistency. Incredible.'; badge='🏆 '+count+' sessions'; big=true; }
  else if(count%25===0){ emoji='🥇'; title=count+' practices!'; msg='Milestone unlocked — keep crushing it!'; badge='⭐ '+count+' sessions'; big=true; }
  else if(count%10===0){ emoji='🔥'; title=count+' practices!'; msg='Double digits and climbing!'; badge='⭐ '+count+' sessions'; big=true; }
  // a day streak can add a badge and (for 5+) upgrade to a big celebration
  if(streak>=3){
    if(streak>=5) big=true;
    badge = badge ? (badge+' · 🔥 '+streak+'-day streak') : ('🔥 '+streak+'-day streak');
    if(!big && count%10!==0 && count!==1){ emoji='🔥'; title=streak+'-day streak!'; msg='On fire — '+streak+' days in a row!'; }
  }
  _showCelebration(emoji,title,msg,badge,big);
}
function _showCelebration(emoji,title,msg,badge,big){
  const el=document.getElementById('celebrate');
  document.getElementById('celEmoji').textContent=emoji;
  document.getElementById('celTitle').textContent=title;
  document.getElementById('celMsg').textContent=msg;
  const b=document.getElementById('celBadge');
  if(badge){ b.textContent=badge; b.hidden=false; } else { b.hidden=true; }
  el.classList.add('show'); el.setAttribute('aria-hidden','false');
  _runConfetti(big?260:120);
  playFanfare(big);
  clearTimeout(_celTimer);
  _celTimer=setTimeout(hideCelebration, big?3300:2400);
}
function hideCelebration(){
  const el=document.getElementById('celebrate');
  el.classList.remove('show'); el.setAttribute('aria-hidden','true');
  cancelAnimationFrame(_celRAF);
  const c=document.getElementById('celebrateCanvas'); const cx=c.getContext('2d'); cx&&cx.clearRect(0,0,c.width,c.height);
}
document.getElementById('celebrate').addEventListener('click', hideCelebration);

/* Pick the variant from ?about= override, then timezone, then language, then DEFAULT. */
function pickAboutVariant(){
  try{
    var q = new URLSearchParams(location.search).get('about');
    if(q && ABOUT[q.toUpperCase()]) return q.toUpperCase();
  }catch(e){}
  var tz = '';
  try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch(e){}
  if(TZ_TO_VARIANT[tz]) return TZ_TO_VARIANT[tz];
  var lang = (navigator.language || '').toLowerCase();
  if(lang === 'es-pe') return 'PE';
  if(lang.indexOf('en-us') === 0) return 'US';
  return 'DEFAULT';
}

(function(){
  var splash = document.getElementById('splash');
  if(!splash) return;
  var frame = document.getElementById('spPhotos');
  var prog  = document.getElementById('spProg');
  var photoEls = [], dots = [], i = 0, rotateId = null, dismissId = null;

  function prettyUrl(u){ return String(u||'').replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/$/,''); }

  function makeRow(icon, text, href){
    var el = href ? document.createElement('a') : document.createElement('div');
    el.className = 'sp-row' + (href ? ' tel' : '');
    if(href){ el.href = href; el.target = '_blank'; el.rel = 'noopener'; }
    var ic = document.createElement('span'); ic.className = 'sp-ic'; ic.textContent = icon;
    var tx = document.createElement('span'); tx.textContent = text;
    el.appendChild(ic); el.appendChild(tx);
    return el;
  }

  function buildContact(v){
    var wrap = document.getElementById('spContact');
    wrap.innerHTML = '';
    var t = v.contactType, val = v.contactValue || '', row = null;
    if(t === 'whatsapp'){
      var digits = val.replace(/[^0-9]/g,'');
      var href = 'https://wa.me/' + digits + (v.waMessage ? ('?text=' + encodeURIComponent(v.waMessage)) : '');
      row = makeRow('💬', val, href);
    } else if(t === 'facebook'){
      row = makeRow('📘', prettyUrl(val), val);
    } else if(t === 'website'){
      row = makeRow('🌐', prettyUrl(val), val);
    } else if(val){
      row = makeRow('📞', val, 'tel:' + val.replace(/[^0-9+]/g,''));
    }
    if(row) wrap.appendChild(row);
    if(v.location) wrap.appendChild(makeRow('📍', v.location, null));
    wrap.style.display = wrap.children.length ? 'flex' : 'none';
  }

  /* keep only photos whose files actually load (preserves order); callback gets the list */
  function resolvePhotos(list, cb){
    list = list || [];
    var ok = {}, pending = list.length;
    if(!pending){ cb([]); return; }
    list.forEach(function(src){
      var im = new Image();
      im.onload  = function(){ ok[src] = true; done(); };
      im.onerror = function(){ done(); };
      im.src = src;
    });
    function done(){ if(--pending === 0) cb(list.filter(function(s){ return ok[s]; })); }
  }

  function buildPhotos(list){
    frame.innerHTML = '';
    photoEls = []; dots = [];
    if(!list.length){ frame.classList.add('sp-hide'); return; }
    frame.classList.remove('sp-hide');
    list.forEach(function(src, idx){
      var im = document.createElement('img');
      im.className = 'sp-photo' + (idx===0 ? ' on' : '');
      im.src = src; im.alt = '';
      frame.appendChild(im); photoEls.push(im);
    });
    var dotsWrap = document.createElement('div'); dotsWrap.className = 'sp-dots';
    list.forEach(function(_, idx){
      var d = document.createElement('span'); d.className = 'sp-dot' + (idx===0 ? ' on' : '');
      dotsWrap.appendChild(d); dots.push(d);
    });
    frame.appendChild(dotsWrap);
  }

  function setActive(n){
    photoEls.forEach(function(p,idx){ p.classList.toggle('on', idx===n); });
    dots.forEach(function(d,idx){ d.classList.toggle('on', idx===n); });
  }

  function renderVariant(v){
    document.getElementById('spTagline').textContent = v.tagline || '';
    document.getElementById('spName').textContent    = v.name || '';
    document.getElementById('spSub').textContent     = v.subtitle || '';
    document.getElementById('spSkip').textContent    = v.button || 'Enter app ›';
    buildContact(v);
    resolvePhotos(v.photos, function(available){ buildPhotos(available); i = 0; setActive(0); });
  }

  function openSplash(){
    clearInterval(rotateId); clearTimeout(dismissId);
    renderVariant(ABOUT[pickAboutVariant()] || ABOUT.DEFAULT);
    i = 0;
    document.body.classList.add('splash-lock');
    splash.classList.remove('hide');
    // restart the 10-second countdown progress bar
    prog.classList.remove('run');
    void prog.offsetWidth;                 // force reflow so the reset takes effect
    requestAnimationFrame(function(){ prog.classList.add('run'); });
    // cycle the photos across the 10 seconds (~2.4s each)
    rotateId = setInterval(function(){
      if(photoEls.length){ i = (i + 1) % photoEls.length; setActive(i); }
    }, 2400);
    dismissId = setTimeout(dismissSplash, 10000); // auto-close after 10 seconds
  }

  function dismissSplash(){
    clearInterval(rotateId); clearTimeout(dismissId);
    splash.classList.add('hide');
    document.body.classList.remove('splash-lock');
    if(typeof hasProfile === 'function' && !hasProfile() && typeof openProfileSetup === 'function'){ openProfileSetup(); }
  }

  document.getElementById('spSkip').addEventListener('click', dismissSplash);
  window.openAbout = openSplash;   // let the bottom "About" button reopen the intro
  openSplash();                    // show on launch
})();
